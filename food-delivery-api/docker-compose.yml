version: '3.8'

services:
  postgres:
    container_name: postgres_container
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_delivery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
    networks:
      - my_persistent_network

volumes:
  pgdata:

networks:
  my_persistent_network:
    driver: bridge